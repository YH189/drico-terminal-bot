[project]
name = "drico-bot"
version = "0.1.0"
description = "A terminal keyword-router chatbot"
requires-python = ">=3.8"

[project.scripts]
drico-bot = "drico_bot.main:run"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["drico_bot*"]

[tool.setuptools.package-data]
drico_bot = ["data/sources.json"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"