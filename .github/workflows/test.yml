name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11bd719010bbe28b683eadfe6dd8864c2c8d4183 # v4
      - uses: actions/setup-python@0b93645e9fea731d697f9a947a88f571e2dae353 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run tests
        run: python -m pytest -q
        env:
          PYTHONPATH: .
